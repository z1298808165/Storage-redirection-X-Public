name: Android 原生构建缓存
description: 复用 NDK、libcxx 与 C/C++ 编译缓存
inputs:
  target:
    description: Android Rust 目标三元组
    required: true
runs:
  using: composite
  steps:
    - name: 准备 NDK 缓存目录权限
      shell: bash
      run: |
        ndk="$ANDROID_HOME/ndk/$SRX_NDK_VERSION"
        if [ -d "$ndk" ]; then
          sudo chown -R "$(id -u):$(id -g)" "$ndk"
        fi

    - name: 恢复 Android NDK
      id: ndk-cache
      uses: actions/cache/restore@v5.0.5
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/${{ env.SRX_NDK_VERSION }}
        key: ${{ runner.os }}-android-ndk-${{ env.SRX_NDK_VERSION }}

    - name: 安装 Android SDK 构建依赖
      shell: bash
      run: |
        for attempt in 1 2 3; do
          if sdkmanager "$SRX_ANDROID_PLATFORM" "$SRX_ANDROID_BUILD_TOOLS" "ndk;$SRX_NDK_VERSION"; then
            break
          fi
          if [ "$attempt" -eq 3 ]; then
            exit 1
          fi
          rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/ndk/$SRX_NDK_VERSION"
          sleep $((attempt * 10))
        done
        echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$SRX_NDK_VERSION" >> "$GITHUB_ENV"

    - name: 保存 Android NDK 缓存
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5.0.5
      with:
        path: ${{ env.ANDROID_HOME }}/ndk/${{ env.SRX_NDK_VERSION }}
        key: ${{ runner.os }}-android-ndk-${{ env.SRX_NDK_VERSION }}

    - name: 恢复 libcxx 构建依赖
      uses: actions/cache@v5.0.5
      with:
        path: ~/.cache/srx
        key: ${{ runner.os }}-libcxx-${{ env.SRX_NDK_VERSION }}-${{ hashFiles('build.rs') }}

    - name: 安装原生构建工具
      shell: bash
      run: |
        if ! command -v cmake >/dev/null || ! command -v ninja >/dev/null || ! command -v ccache >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ccache
        fi

    - name: 配置编译缓存
      shell: bash
      env:
        ANDROID_TARGET: ${{ inputs.target }}
      run: |
        case "$ANDROID_TARGET" in
          aarch64-linux-android|x86_64-linux-android) ;;
          *) echo "不支持的原生缓存目标：$ANDROID_TARGET" >&2; exit 1 ;;
        esac
        {
          echo "CCACHE_DIR=$RUNNER_TEMP/srx-ccache"
          echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          echo "CCACHE_COMPILERCHECK=content"
          echo "CCACHE_MAXSIZE=256M"
          echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
          echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
          echo "CC_${ANDROID_TARGET//-/_}=ccache ${ANDROID_TARGET}29-clang"
          echo "CXX_${ANDROID_TARGET//-/_}=ccache ${ANDROID_TARGET}29-clang++"
        } >> "$GITHUB_ENV"

    - name: 恢复 C/C++ 编译缓存
      uses: actions/cache@v5.0.5
      with:
        path: ${{ runner.temp }}/srx-ccache
        # 原生输入变化后保存新快照；仅 Rust 业务代码变化时复用同一份缓存。
        key: ${{ runner.os }}-ccache-${{ inputs.target }}-${{ env.SRX_NDK_VERSION }}-${{ hashFiles('native/**', 'vendor/lsplant/**', 'Cargo.lock', 'build.rs') }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ inputs.target }}-${{ env.SRX_NDK_VERSION }}-
