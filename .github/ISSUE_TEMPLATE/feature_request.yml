name: 功能建议
description: 提出新功能、改进想法或体验优化建议
title: "[功能建议] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题或使用场景
      description: 说明目前遇到了什么不便，或者希望在什么场景下获得什么能力。
      placeholder: |
        例如：为多个应用批量配置相同路径规则时，需要逐个应用手动填写，效率较低。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或方案
      description: 描述希望实现的功能；如有理想的交互方式（管理 App / WebUI、入口位置、配置方式）请一并说明。
      placeholder: |
        例如：希望支持在配置模板中直接包含路径映射规则，并在应用列表多选后一键应用。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代方案
      description: 目前是否有可用的替代做法（例如手动编辑 JSON、使用脚本），以及为什么不满足需求。
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 相关截图、示意图、参考实现或其它有助于理解建议的材料。
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有重复建议
          required: true
        - label: 我已阅读 README 与配置说明，确认该功能目前不存在
          required: true
        - label: 我理解功能建议不保证会被实现，维护者会按可行性评估
          required: true
