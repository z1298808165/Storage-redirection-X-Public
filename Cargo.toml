[package]
name = "srx_core"
version = "1.2.59"
edition = "2024"

[workspace]
members = ["tests/native-config-fixtures"]
default-members = ["."]
resolver = "3"

[lib]
name = "srx_core"
crate-type = ["cdylib"]

[[bin]]
name = "srx_daemon"
path = "src/bin/srx_daemon.rs"

[dependencies]
libc = "0.2"
jni-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
# hook 依赖固定到具体 commit，避免上游 main 推进后本地与 CI 构建出不同的 hook 实现。
# 升级 hook 能力时需同步更新这里的 rev 与 Cargo.lock。
srx_hook = { git = "https://github.com/Kindness-Kismet/srx_hook.git", rev = "5ec71115c4b674d282f337bb7523ba66471bd98a" }
srx_inline_hook = { git = "https://github.com/Kindness-Kismet/srx_inline_hook.git", rev = "e9abbd58e0c6ee459bb0f7724b896a70ece0a661" }
log = "0.4"
fuser = { version = "0.17", default-features = false }

[patch.crates-io]
fuser = { path = "vendor/fuser-android" }

[profile.release]
# FUSE 读写回调与 hook trampoline 属于高频热路径，"z" 会禁用循环向量化并过度压制内联；
# 实测改用 "s" 后 libsrx_core.so 与 srx_daemon 合计仅增大约 324KB（约 12%），换取热路径优化更划算。
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
