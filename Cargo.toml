[package]
name = "srx_core"
version = "2.3.0"
edition = "2024"

[workspace]
members = ["tests/native-config-fixtures"]
default-members = ["."]
resolver = "3"

[lib]
name = "srx_core"
crate-type = ["cdylib"]

[[bin]]
name = "srx_daemon"
path = "src/bin/srx_daemon.rs"

[dependencies]
libc = "0.2"
jni-sys = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
once_cell = "1.21"
# hook 依赖固定到具体 commit，避免上游 main 推进后本地与 CI 构建出不同的 hook 实现。
# 升级 hook 能力时需同步更新这里的 rev 与 Cargo.lock。
srx_hook = { git = "https://github.com/Kindness-Kismet/srx_hook.git", rev = "481c45ac2ab10c2a5f15c4fad91485d4639b8dc5" }
srx_inline_hook = { git = "https://github.com/Kindness-Kismet/srx_inline_hook.git", rev = "c8abb2e7249dc72f5e1113c3eb1def202fa0d3cb" }
log = "0.4"
fuser = { version = "0.17", default-features = false }

[patch.crates-io]
fuser = { path = "vendor/fuser-android" }

[profile.release]
# FUSE 读写回调与 hook trampoline 属于高频热路径，"z" 会禁用循环向量化并过度压制内联；
# 实测改用 "s" 后 libsrx_core.so 与 srx_daemon 合计仅增大约 324KB（约 12%），换取热路径优化更划算。
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
